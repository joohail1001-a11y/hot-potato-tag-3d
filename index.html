<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1b161d">
<title>뜨거운 감자 술래잡기 3D</title>
<style>html,body{margin:0;width:100%;height:100%;background:#15151b;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow:hidden}#loading{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 35%,#5a281b,#15151b 55%)}.potato{font-size:72px;animation:b .7s ease-in-out infinite alternate}h1{margin:12px 0 6px;font-size:clamp(28px,7vw,48px)}p{opacity:.72}.bar{width:min(360px,72vw);height:10px;border-radius:99px;background:#ffffff18;overflow:hidden;margin-top:15px}.bar>i{display:block;height:100%;width:20%;background:linear-gradient(90deg,#ffd76b,#ff6b28);animation:l 1.2s ease-in-out infinite}@keyframes b{to{transform:translateY(-8px) rotate(4deg)}}@keyframes l{0%{transform:translateX(-100%)}100%{transform:translateX(600%)}}</style>
</head>
<body><div id="loading"><div class="potato">🥔🔥</div><h1>뜨거운 감자 술래잡기 3D</h1><p>게임을 불러오는 중...</p><div class="bar"><i></i></div></div>
<script>
(async()=>{try{const r=await fetch('game-index.gz.b64?v=mobile1');if(!r.ok)throw new Error('bundle');const b64=(await r.text()).trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div class="potato">⚠️</div><h1>로딩 실패</h1><p>브라우저를 업데이트하거나 새로고침해 주세요.</p>'}})();
</script></body></html>
